spring.application.name=backend

# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/autofixops}
spring.datasource.username=${DATABASE_USERNAME:autofixops_user}
spring.datasource.password=${DATABASE_PASSWORD:target_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Hibernate
# Note: DDL-auto should be validate or none when using Flyway, but for this hackathon
# we'll let Flyway manage it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.autofixops=DEBUG
