spring.application.name=target-app

# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/target_db}
spring.datasource.username=${DATABASE_USERNAME:target_user}
spring.datasource.password=${DATABASE_PASSWORD:target_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Incident 2 Trigger
TARGET_ENV=${TARGET_ENV:default}
