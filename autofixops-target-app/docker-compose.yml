version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: target_db
      POSTGRES_USER: target_user
      POSTGRES_PASSWORD: target_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target_user -d target_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/target_db
      - DATABASE_USERNAME=target_user
      - DATABASE_PASSWORD=target_password
      # This is correct. To trigger Incident 2, change this to CRASH.
      - TARGET_ENV=production
    depends_on:
      db:
        condition: service_healthy
